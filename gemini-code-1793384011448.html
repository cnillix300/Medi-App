<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tirosint & Supplements</title>
  
  <!-- App-Verhalten für Android & iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f8fafc">
  
  <!-- Web App Manifest direkt integriert -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Tirosint App","short_name":"Tirosint","start_url":".","display":"standalone","background_color":"#f8fafc","theme_color":"#f8fafc"}'>

  <!-- Tailwind CSS für das Design -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex justify-center p-0 sm:p-4">

  <div class="w-full max-w-md bg-white min-h-screen sm:min-h-0 sm:rounded-3xl shadow-xl flex flex-col justify-between overflow-hidden">
    
    <!-- Main Content -->
    <div class="p-5 space-y-5">
      
      <!-- Header -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 bg-emerald-600 rounded-2xl flex items-center justify-center text-white shadow-md shadow-emerald-200">
            <i data-lucide="pill" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 class="font-bold text-slate-800 text-lg leading-tight">Tirosint &amp; Supplements</h1>
            <p id="current-date" class="text-xs font-medium text-slate-400">Freitag, 30. Oktober 2026</p>
          </div>
        </div>
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Aktiv
        </span>
      </div>

      <!-- Card 1: Kur status -->
      <div class="bg-slate-50 border border-slate-100 rounded-2xl p-4 space-y-3">
        <div class="flex justify-between items-start">
          <div class="flex items-center gap-2.5">
            <div class="text-emerald-600 bg-emerald-100/60 p-2 rounded-xl">
              <i data-lucide="calendar" class="w-5 h-5"></i>
            </div>
            <h2 class="font-semibold text-slate-800 text-sm">14-Tage Tirosint Wechselkur</h2>
          </div>
          <span class="bg-emerald-100/80 text-emerald-800 text-[11px] font-medium px-2.5 py-1 rounded-full">
            Kur startet morgen (31.10.)
          </span>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
          <div class="bg-emerald-500 h-full w-[0%]" id="kur-progress"></div>
        </div>

        <div class="flex justify-between items-center text-xs text-slate-500 pt-0.5">
          <span>Start: morgen, 31.10.2026</span>
          <button onclick="toggleKurDetails()" class="text-emerald-700 font-semibold hover:underline">Details ansehen</button>
        </div>
      </div>

      <!-- Card 2: Morning Medication -->
      <div class="bg-slate-50 border border-slate-100 rounded-2xl p-4 space-y-3">
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-2 text-slate-700 font-semibold text-sm">
            <i data-lucide="sun" class="w-4 h-4 text-amber-500"></i>
            <span>Morgens (07:30 Uhr)</span>
          </div>
          <span class="bg-sky-50 text-sky-700 text-xs px-2.5 py-1 rounded-full font-medium border border-sky-100">
            Weichkapsel
          </span>
        </div>

        <!-- Inner Item Card -->
        <div class="bg-white border border-slate-100 rounded-xl p-3.5 flex items-center justify-between shadow-sm">
          <div class="space-y-0.5">
            <h3 class="font-bold text-slate-800 text-base">Tirosint</h3>
            <p class="text-xs text-slate-400">Nüchtern mit etwas Wasser einnehmen</p>
          </div>
          <div class="text-right flex items-center gap-3">
            <div>
              <div class="text-emerald-600 font-extrabold text-xl leading-none">150 <span class="text-sm font-semibold">µg</span></div>
              <div class="text-[10px] text-slate-400 font-medium mt-0.5">Morgen: 150 µg</div>
            </div>
            <button id="check-btn" onclick="toggleTake()" class="w-10 h-10 rounded-xl border-2 border-slate-200 flex items-center justify-center text-slate-300 transition-all active:scale-95">
              <i data-lucide="check" class="w-6 h-6"></i>
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Bottom Notification / Quick Action -->
    <div class="p-4 bg-slate-50 border-t border-slate-100 text-center">
      <p class="text-xs text-slate-400">Erinnerungen sind aktiv für 07:30 Uhr</p>
    </div>

  </div>

  <script>
    // Icons initialisieren
    lucide.createIcons();

    // Zustand laden/speichern
    let taken = localStorage.getItem('tirosint_taken') === 'true';

    function updateUI() {
      const btn = document.getElementById('check-btn');
      if (taken) {
        btn.classList.remove('border-slate-200', 'text-slate-300');
        btn.classList.add('bg-emerald-500', 'border-emerald-500', 'text-white');
      } else {
        btn.classList.remove('bg-emerald-500', 'border-emerald-500', 'text-white');
        btn.classList.add('border-slate-200', 'text-slate-300');
      }
    }

    function toggleTake() {
      taken = !taken;
      localStorage.setItem('tirosint_taken', taken);
      updateUI();
    }

    function toggleKurDetails() {
      alert("Wechselkur Details:\n\n• Tag 1-14: Wechselnde Dosierung laut Einnahmeplan.\n• Start: 31.10.2026\n• Status: Vorbereitung");
    }

    // Beim Start ausführen
    updateUI();
  </script>
</body>
</html>
