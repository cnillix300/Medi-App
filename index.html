<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tirosint & Supplements</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #141c2e;
            --card-border: #1e293b;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --badge-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .app-icon svg {
            width: 26px;
            height: 26px;
            fill: #ffffff;
        }

        .header-title h1 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
        }

        .header-title p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: var(--badge-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-icon:hover {
            background: #273548;
        }

        .btn-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Card Base */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
        }

        /* Progress Card */
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .progress-badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .progress-bar-bg {
            background: #1e293b;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar-fill {
            background: var(--accent-green);
            height: 100%;
            width: 7%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-footer {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
        }

        .progress-footer strong {
            color: var(--text-main);
        }

        /* Section Title */
        .section-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Item Row */
        .item-row {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-info {
            flex-grow: 1;
            padding-right: 12px;
            cursor: pointer;
        }

        .item-title-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .item-name {
            font-size: 16px;
            font-weight: 700;
        }

        .tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .tag-blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .tag-orange { background: rgba(249, 115, 22, 0.15); color: #fb923c; }
        .tag-purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
        .tag-green { background: rgba(16, 185, 129, 0.15); color: #34d399; }

        .item-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .item-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-dose {
            font-size: 16px;
            font-weight: 700;
            text-align: right;
        }

        .item-dose span {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Stift-Icon im kleinen Rahmen */
        .edit-btn-frame {
            background: var(--badge-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .edit-btn-frame:hover {
            color: var(--text-main);
            border-color: var(--accent-green);
        }

        .edit-btn-frame svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        /* Checkbox Button */
        .check-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 2px solid var(--card-border);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .check-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s;
        }

        .check-btn.checked {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }

        .check-btn.checked svg {
            stroke: #ffffff;
            fill: none;
        }

        /* Timer Box */
        .timer-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            display: none;
            text-align: center;
        }

        .timer-box.active {
            display: block;
        }

        .timer-text {
            font-size: 13px;
            color: var(--accent-green);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .timer-countdown {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
        }

        /* Footer Info */
        .footer-note {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 24px;
            margin-bottom: 12px;
        }

        /* Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
        }

        .form-control {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px;
            color: var(--text-main);
            font-size: 14px;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background: var(--accent-green);
            color: white;
        }

        .btn-secondary {
            background: var(--badge-bg);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* Kalender / Historie Grid */
        .history-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 10px;
            margin-bottom: 16px;
        }

        .history-day {
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            text-align: center;
            padding: 6px 2px;
            font-size: 11px;
        }

        .history-day.taken {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--accent-green);
            color: var(--accent-green);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="app-icon">
                    <svg viewBox="0 0 24 24"><path d="M4.5 10.5C3.67 10.5 3 11.17 3 12s.67 1.5 1.5 1.5h15c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5h-15zM10.5 4.5C10.5 3.67 11.17 3 12 3s1.5.67 1.5 1.5v15c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5v-15z"/></svg>
                </div>
                <div class="header-title">
                    <h1>Tirosint & Supplements</h1>
                    <p id="current-date">Freitag, 30. Oktober 2026</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="openAddModal()" title="Neuen Eintrag hinzufügen">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </button>
                <button class="btn-icon" onclick="openSettingsModal()" title="Einstellungen">
                    <div class="edit-btn-frame" style="border:none; background:transparent; width:auto; height:auto;">
                        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    </div>
                </button>
            </div>
        </div>

        <!-- 14-Tage Wechselkur Card -->
        <div class="card">
            <div class="progress-header">
                <div class="progress-title">
                    📅 14-Tage Wechselkur
                </div>
                <div class="progress-badge" id="kur-tag-badge">Tag 1 von 14</div>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div class="progress-footer">
                <span>Wechsel: 150 µg ⇄ 137,5 µg</span>
                <strong id="today-dose-text">Heute: 150 µg</strong>
            </div>
        </div>

        <!-- Dynamischer Container für Medikamente & Supplements -->
        <div id="meds-container"></div>

        <div class="footer-note">Erinnerungen aktiv für alle Einträge</div>
    </div>

    <!-- Modal für Einstellungen (Startdatum) -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Kur-Einstellungen</h3>
                <button class="btn-icon" onclick="closeSettingsModal()">✕</button>
            </div>
            <div class="form-group">
                <label>Startdatum der 14-Tage-Kur</label>
                <input type="date" id="start-date-input" class="form-control">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeSettingsModal()">Abbrechen</button>
                <button class="btn btn-primary" onclick="saveSettings()">Speichern</button>
            </div>
        </div>
    </div>

    <!-- Modal für Hinzufügen / Bearbeiten von Einträgen -->
    <div class="modal" id="item-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="item-modal-title">Eintrag hinzufügen</h3>
                <button class="btn-icon" onclick="closeItemModal()">✕</button>
            </div>
            <input type="hidden" id="edit-item-id">
            <div class="form-group">
                <label>Name (z.B. Magnesium, Vitamin D3)</label>
                <input type="text" id="form-name" class="form-control" placeholder="Name eingeben">
            </div>
            <div class="form-group">
                <label>Rhythmus</label>
                <select id="form-rhythm" class="form-control">
                    <option value="Täglich">Täglich</option>
                    <option value="Alle 2 Tage">Alle 2 Tage</option>
                    <option value="Wöchentlich">Wöchentlich</option>
                    <option value="14-Tägig">14-Tägig</option>
                </select>
            </div>
            <div class="form-group">
                <label>Dosierung & Einheit (z.B. 1x, 5 Tropfen)</label>
                <input type="text" id="form-dose" class="form-control" placeholder="z.B. 1x oder 5 Tropfen">
            </div>
            <div class="form-group">
                <label>Uhrzeit (Anzeige)</label>
                <input type="text" id="form-time-label" class="form-control" placeholder="z.B. 07:30 Uhr oder 18:30 Uhr">
            </div>
            <div class="form-group">
                <label>Wartezeit-Timer (0 bis 60 Minuten)</label>
                <input type="number" id="form-timer-mins" class="form-control" min="0" max="60" value="0" placeholder="Minuten (z.B. 30)">
            </div>
            <div class="form-group">
                <label>Beschreibung / Hinweis</label>
                <input type="text" id="form-desc" class="form-control" placeholder="z.B. Vor dem Schlafen">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-danger" id="btn-delete-item" onclick="deleteCurrentItem()" style="display:none;">Löschen</button>
                <button class="btn btn-secondary" onclick="closeItemModal()">Abbrechen</button>
                <button class="btn btn-primary" onclick="saveItemForm()">Speichern</button>
            </div>
        </div>
    </div>

    <!-- Modal für Kalender / Erfolgs-Historie -->
    <div class="modal" id="history-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="history-modal-title">Erfolgs-Übersicht</h3>
                <button class="btn-icon" onclick="closeHistoryModal()">✕</button>
            </div>
            <p style="font-size:13px; color:var(--text-muted); margin-bottom: 8px;">Letzte 14 Tage Einnahme-Verlauf:</p>
            <div class="history-grid" id="history-grid-container"></div>
            <div id="history-stats" style="font-size:13px; font-weight:600; color:var(--accent-green); text-align:center; margin-top: 10px;"></div>
            <div class="modal-buttons" style="margin-top: 16px;">
                <button class="btn btn-primary" onclick="closeHistoryModal()">Schließen</button>
            </div>
        </div>
    </div>

    <script>
        const defaultItems = [
            { id: 'tirosint', name: 'Tirosint', tag: 'Weichkapsel', tagClass: 'tag-blue', dose: '150', unit: 'µg', desc: 'Nüchtern mit Wasser', timeLabel: '07:30 Uhr', timerMins: 30, isTirosint: true },
            { id: 'vitd', name: 'Vitamin D3', tag: 'Alle 2 Tage', tagClass: 'tag-orange', dose: '5', unit: 'Tropfen', desc: '5 Tropfen einnehmen', timeLabel: '07:30 Uhr', timerMins: 0, isTirosint: false },
            { id: 'magnesium', name: 'Magnesium', tag: 'Täglich', tagClass: 'tag-purple', dose: '1x', unit: 'Abends', desc: '1 Dosis vor dem Schlafen', timeLabel: '18:30 Uhr', timerMins: 0, isTirosint: false }
        ];

        let items = JSON.parse(localStorage.getItem("tirosint_custom_items")) || defaultItems;

        const startDateKey = "tirosint_start_date";
        let startDate = localStorage.getItem(startDateKey) || "2026-10-31";

        function updateKurInfo() {
            const start = new Date(startDate);
            const today = new Date();
            today.setHours(0,0,0,0);
            start.setHours(0,0,0,0);

            const diffTime = today - start;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            let currentDayInCycle = (diffDays % 14) + 1;
            if (currentDayInCycle < 1) currentDayInCycle = 1;

            const is150 = currentDayInCycle % 2 !== 0;
            const dose = is150 ? "150 µg" : "137,5 µg";

            document.getElementById("kur-tag-badge").innerText = `Tag ${currentDayInCycle} von 14`;
            document.getElementById("today-dose-text").innerText = `Heute: ${dose}`;

            items.forEach(item => {
                if (item.isTirosint) {
                    item.dose = is150 ? "150" : "137,5";
                    item.unit = "µg";
                }
            });

            const progressPercent = (currentDayInCycle / 14) * 100;
            document.getElementById("progress-fill").style.width = progressPercent + "%";
            renderItems();
        }

        const todayStr = new Date().toISOString().slice(0,10);
        const storagePrefix = "med_status_" + todayStr + "_";

        function renderItems() {
            const container = document.getElementById("meds-container");
            container.innerHTML = "";

            let html = '';
            items.forEach(item => {
                const isChecked = localStorage.getItem(storagePrefix + item.id) === "true";
                html += `
                    <div class="item-row">
                        <div class="item-info" onclick="openHistoryModal('${item.id}', '${item.name}')" title="Klicken für Verlaufs-Kalender">
                            <div class="item-title-line">
                                <span class="item-name">${item.name}</span>
                                <span class="tag ${item.tagClass || 'tag-green'}">${item.tag}</span>
                            </div>
                            <div class="item-desc">${item.desc} (${item.timeLabel || 'Täglich'})</div>
                        </div>
                        <div class="item-right">
                            <div class="item-dose">${item.dose}<span>${item.unit}</span></div>
                            <button class="edit-btn-frame" onclick="openEditItemModal('${item.id}')" title="Bearbeiten">
                                <!-- Stift-Icon -->
                                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                            </button>
                            <button class="check-btn ${isChecked ? 'checked' : ''}" id="btn-${item.id}" onclick="handleCheck('${item.id}', ${item.timerMins || 0})">
                                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            </button>
                        </div>
                    </div>
                `;
            });

            // Timer Box (falls aktiv)
            html += `
                <div class="timer-box" id="timer-box">
                    <div class="timer-text" id="timer-label-text">⏳ Wartezeit läuft...</div>
                    <div class="timer-countdown" id="timer-countdown">00:00</div>
                </div>
            `;

            container.innerHTML = html;

            const savedEndTime = localStorage.getItem(timerKey);
            if (savedEndTime && savedEndTime > Date.now()) {
                startTimer(parseInt(savedEndTime), 30);
            }
        }

        updateKurInfo();

        function handleCheck(id, timerMins) {
            const btn = document.getElementById("btn-" + id);
            btn.classList.toggle("checked");
            const isChecked = btn.classList.contains("checked");
            localStorage.setItem(storagePrefix + id, isChecked);

            // Auch für Historie speichern
            localStorage.setItem("history_" + id + "_" + todayStr, isChecked);

            if (timerMins > 0) {
                if (isChecked) {
                    const endTime = Date.now() + timerMins * 60 * 1000;
                    localStorage.setItem(timerKey, endTime);
                    startTimer(endTime, timerMins);
                } else {
                    localStorage.removeItem(timerKey);
                    stopTimer();
                }
            }
        }

        let timerInterval = null;
        const timerKey = "tirosint_timer_end_" + todayStr;

        function startTimer(endTime, totalMins) {
            const box = document.getElementById("timer-box");
            if (box) box.classList.add("active");
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                const timeLeft = endTime - Date.now();
                const countdownEl = document.getElementById("timer-countdown");
                if (!countdownEl) return;

                if (timeLeft <= 0) {
                    countdownEl.innerText = "00:00 - Zeit vorbei! 🎉";
                    clearInterval(timerInterval);
                    localStorage.removeItem(timerKey);
                } else {
                    const mins = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    const secs = Math.floor((timeLeft % (1000 * 60)) / 1000);
                    countdownEl.innerText = String(mins).padStart(2, '0') + ":" + String(secs).padStart(2, '0');
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            const box = document.getElementById("timer-box");
            if (box) box.classList.remove("active");
        }

        // Modal Funktionen (Einstellungen)
        function openSettingsModal() {
            document.getElementById("start-date-input").value = startDate;
            document.getElementById("settings-modal").classList.add("open");
        }
        function closeSettingsModal() {
            document.getElementById("settings-modal").classList.remove("open");
        }
        function saveSettings() {
            const newDate = document.getElementById("start-date-input").value;
            if (newDate) {
                startDate = newDate;
                localStorage.setItem(startDateKey, startDate);
                updateKurInfo();
            }
            closeSettingsModal();
        }

        // Modal Hinzufügen / Bearbeiten
        function openAddModal() {
            document.getElementById("item-modal-title").innerText = "Neuen Eintrag hinzufügen";
            document.getElementById("edit-item-id").value = "";
            document.getElementById("form-name").value = "";
            document.getElementById("form-rhythm").value = "Täglich";
            document.getElementById("form-dose").value = "1x";
            document.getElementById("form-time-label").value = "18:30 Uhr";
            document.getElementById("form-timer-mins").value = "0";
            document.getElementById("form-desc").value = "";
            document.getElementById("btn-delete-item").style.display = "none";
            document.getElementById("item-modal").classList.add("open");
        }

        function openEditItemModal(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            document.getElementById("item-modal-title").innerText = "Eintrag bearbeiten";
            document.getElementById("edit-item-id").value = item.id;
            document.getElementById("form-name").value = item.name;
            document.getElementById("form-rhythm").value = item.tag;
            document.getElementById("form-dose").value = item.dose;
            document.getElementById("form-time-label").value = item.timeLabel || "07:30 Uhr";
            document.getElementById("form-timer-mins").value = item.timerMins || 0;
            document.getElementById("form-desc").value = item.desc;
            
            document.getElementById("btn-delete-item").style.display = item.isTirosint ? "none" : "block";
            document.getElementById("item-modal").classList.add("open");
        }

        function closeItemModal() {
            document.getElementById("item-modal").classList.remove("open");
        }

        function saveItemForm() {
            const editId = document.getElementById("edit-item-id").value;
            const name = document.getElementById("form-name").value;
            const rhythm = document.getElementById("form-rhythm").value;
            const dose = document.getElementById("form-dose").value;
            const timeLabel = document.getElementById("form-time-label").value;
            const timerMins = parseInt(document.getElementById("form-timer-mins").value) || 0;
            const desc = document.getElementById("form-desc").value;

            if (!name) return;

            if (editId) {
                const item = items.find(i => i.id === editId);
                if (item) {
                    item.name = name;
                    item.tag = rhythm;
                    item.dose = dose;
                    item.timeLabel = timeLabel;
                    item.timerMins = timerMins;
                    item.desc = desc;
                }
            } else {
                const newId = "custom_" + Date.now();
                items.push({
                    id: newId,
                    name: name,
                    tag: rhythm,
                    tagClass: 'tag-green',
                    dose: dose,
                    unit: '',
                    desc: desc,
                    timeLabel: timeLabel,
                    timerMins: timerMins,
                    isTirosint: false
                });
            }

            localStorage.setItem("tirosint_custom_items", JSON.stringify(items));
            closeItemModal();
            renderItems();
        }

        function deleteCurrentItem() {
            const editId = document.getElementById("edit-item-id").value;
            if (!editId) return;

            items = items.filter(i => i.id !== editId);
            localStorage.setItem("tirosint_custom_items", JSON.stringify(items));
            closeItemModal();
            renderItems();
        }

        // Kalender / Historie Modal
        function openHistoryModal(itemId, itemName) {
            document.getElementById("history-modal-title").innerText = `Verlauf: ${itemName}`;
            const gridContainer = document.getElementById("history-grid-container");
            gridContainer.innerHTML = "";

            let takenCount = 0;
            const d = new Date();

            for (let i = 13; i >= 0; i--) {
                const pastDate = new Date();
                pastDate.setDate(d.getDate() - i);
                const dateStr = pastDate.toISOString().slice(0,10);
                const dayNum = pastDate.getDate();

                const wasTaken = localStorage.getItem("history_" + itemId + "_" + dateStr) === "true";
                if (wasTaken) takenCount++;

                gridContainer.innerHTML += `
                    <div class="history-day ${wasTaken ? 'taken' : ''}">
                        <div style="font-size:9px; color:var(--text-muted);">${pastDate.toLocaleDateString('de-DE', {weekday:'short'})}</div>
                        <div style="font-weight:700; font-size:13px;">${dayNum}</div>
                    </div>
                `;
            }

            document.getElementById("history-stats").innerText = `Angenommen an ${takenCount} von den letzten 14 Tagen`;
            document.getElementById("history-modal").classList.add("open");
        }

        function closeHistoryModal() {
            document.getElementById("history-modal").classList.remove("open");
        }
    </script>
</body>
</html>
