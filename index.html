<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medis & Supplements</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #141c2e;
            --card-border: #1e293b;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --badge-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .app-icon svg {
            width: 26px;
            height: 26px;
            fill: #ffffff;
        }

        .header-title h1 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
        }

        .header-title p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: var(--badge-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-icon:hover {
            background: #273548;
        }

        .btn-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Card Base */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
        }

        /* Progress Card */
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .progress-badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .progress-bar-bg {
            background: #1e293b;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar-fill {
            background: var(--accent-green);
            height: 100%;
            width: 7%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-footer {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
        }

        .progress-footer strong {
            color: var(--text-main);
        }

        /* Section Title */
        .section-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Item Row */
        .item-row {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-info {
            flex-grow: 1;
            padding-right: 12px;
            cursor: pointer;
        }

        .item-title-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .item-name {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .type-icon {
            width: 16px;
            height: 16px;
            fill: var(--text-muted);
        }

        .tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .tag-blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .tag-orange { background: rgba(249, 115, 22, 0.15); color: #fb923c; }
        .tag-purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
        .tag-green { background: rgba(16, 185, 129, 0.15); color: #34d399; }

        .item-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .item-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-dose {
            font-size: 16px;
            font-weight: 700;
            text-align: right;
        }

        .item-dose span {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Stift-Icon im farblichen Rahmen */
        .edit-btn-frame {
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .edit-btn-frame:hover {
            background: rgba(59, 130, 246, 0.25);
        }

        .edit-btn-frame svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Checkbox Button */
        .check-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 2px solid var(--card-border);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .check-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s;
        }

        .check-btn.checked {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }

        .check-btn.checked svg {
            stroke: #ffffff;
            fill: none;
        }

        /* Timer Box */
        .timer-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            display: none;
            text-align: center;
        }

        .timer-box.active {
            display: block;
        }

        .timer-text {
            font-size: 13px;
            color: var(--accent-green);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .timer-countdown {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
        }

        /* Footer Info */
        .footer-note {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 24px;
            margin-bottom: 12px;
        }

        /* Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
        }

        .form-control {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px;
            color: var(--text-main);
            font-size: 14px;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background: var(--accent-green);
            color: white;
        }

        .btn-secondary {
            background: var(--badge-bg);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* Kalender / Historie Grid */
        .history-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 10px;
            margin-bottom: 16px;
        }

        .history-day {
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            text-align: center;
            padding: 6px 2px;
            font-size: 11px;
        }

        .history-day.taken {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--accent-green);
            color: var(--accent-green);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="app-icon">
                    <svg viewBox="0 0 24 24"><path d="M4.5 10.5C3.67 10.5 3 11.17 3 12s.67 1.5 1.5 1.5h15c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5h-15zM10.5 4.5C10.5 3.67 11.17 3 12 3s1.5.67 1.5 1.5v15c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5v-15z"/></svg>
                </div>
                <div class="header-title">
                    <h1>Medis & Supplements</h1>
                    <p id="current-date">Freitag, 30. Oktober 2026</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="openAddModal()" title="Neuen Eintrag hinzufügen">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </button>
                <button class="btn-icon" onclick="openSettingsModal()" title="Kur-Einstellungen">
                    <div class="edit-btn-frame" style="width:auto; height:auto; padding:4px;">
                        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    </div>
                </button>
            </div>
        </div>

        <div class="card">
            <div class="progress-header">
                <div class="progress-title">📅 14-Tage Wechselkur (Tirosint)</div>
                <div class="progress-badge" id="kur-tag-badge">Tag 1 von 14</div>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div class="progress-footer">
                <span>Wechsel: 150 µg ⇄ 137,5 µg</span>
                <strong id="today-dose-text">Heute: 150 µg</strong>
            </div>
        </div>

        <div class="timer-box" id="timer-box-global">
            <div class="timer-text" id="timer-label-global">⏳ Wartezeit</div>
            <div class="timer-countdown" id="timer-countdown-global">00:00</div>
        </div>

        <div id="meds-container"></div>

        <div class="footer-note">Erinnerungen aktiv für alle Einträge</div>
    </div>

    <!-- Modal für Kur-Einstellungen -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Kur-Einstellungen</h3>
                <button class="btn-icon" onclick="closeSettingsModal()">✕</button>
            </div>
            <div class="form-group">
                <label>Startdatum der Kur</label>
                <input type="date" id="start-date-input" class="form-control">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-danger" onclick="deleteKur()">Löschen</button>
                <button class="btn btn-secondary" onclick="closeSettingsModal()">Abbrechen</button>
                <button class="btn btn-primary" onclick="saveSettings()">Speichern</button>
            </div>
        </div>
    </div>

    <!-- Modal für Hinzufügen / Bearbeiten -->
    <div class="modal" id="item-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="item-modal-title">Eintrag hinzufügen</h3>
                <button class="btn-icon" onclick="closeItemModal()">✕</button>
            </div>
            <input type="hidden" id="edit-item-id">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="form-name" class="form-control" placeholder="Name eingeben">
            </div>
            <div class="form-group">
                <label>Art</label>
                <select id="form-type" class="form-control">
                    <option value="none">Keine Auswahl</option>
                    <option value="pill">Tabletten/Kapseln</option>
                    <option value="drop">Tropfen</option>
                </select>
            </div>
            <div class="form-group" id="rhythm-group">
                <label>Rhythmus</label>
                <select id="form-rhythm" class="form-control">
                    <option value="Täglich">Täglich</option>
                    <option value="Alle 2 Tage">Alle 2 Tage</option>
                    <option value="Alle 3 Tage">Alle 3 Tage</option>
                    <option value="Alle 4 Tage">Alle 4 Tage</option>
                    <option value="Wöchentlich">Wöchentlich</option>
                    <option value="14-Tägig">14-Tägig</option>
                    <option value="Monatlich">Monatlich</option>
                </select>
            </div>
            <div class="form-group">
                <label>Dosierung & Einheit</label>
                <input type="text" id="form-dose" class="form-control" placeholder="z.B. 1x oder 5 Tropfen">
            </div>
            <div class="form-group">
                <label>Uhrzeit</label>
                <input type="time" id="form-time-input" class="form-control" value="08:00">
            </div>
            <div class="form-group">
                <label>Wartezeit-Timer (0 bis 60 Minuten)</label>
                <input type="number" id="form-timer-mins" class="form-control" min="0" max="60" value="0" placeholder="Minuten">
            </div>
            <div class="form-group">
                <label>Beschreibung / Hinweis</label>
                <input type="text" id="form-desc" class="form-control" placeholder="z.B. Nüchtern mit Wasser">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-danger" id="btn-delete-item" onclick="deleteCurrentItem()" style="display:none;">Löschen</button>
                <button class="btn btn-secondary" onclick="closeItemModal()">Abbrechen</button>
                <button class="btn btn-primary" onclick="saveItemForm()">Speichern</button>
            </div>
        </div>
    </div>

    <!-- Modal für Kalender / Historie -->
    <div class="modal" id="history-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="history-modal-title">Verlauf</h3>
                <button class="btn-icon" onclick="closeHistoryModal()">✕</button>
            </div>
            <p style="font-size:12px; color:var(--text-muted); margin-bottom: 6px;">Letzte 14 Tage Einnahme-Verlauf:</p>
            <div class="history-grid" id="history-grid-container"></div>
            <div id="history-stats" style="font-size:12px; font-weight:600; color:var(--accent-green); text-align:center; margin-top: 8px;"></div>
            <div class="modal-buttons" style="margin-top: 14px;">
                <button class="btn btn-primary" onclick="closeHistoryModal()">Schließen</button>
            </div>
        </div>
    </div>

    <script>
        const pillIcon = `<svg class="type-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8 0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8zm-1-13h2v4h-2zm0 6h2v2h-2z"/></svg>`;
        const dropIcon = `<svg class="type-icon" viewBox="0 0 24 24"><path d="M12 2c-5.33 4.55-8 8.48-8 11.8 0 4.98 3.8 8.2 8 8.2s8-3.22 8-8.2c0-3.32-2.67-7.25-8-11.8z"/></svg>`;

        const defaultItems = [
            { id: 'tirosint', name: 'Tirosint', tag: 'Täglich', tagClass: 'tag-blue', dose: '150', unit: 'µg', desc: 'Nüchtern mit Wasser', timeStr: '07:30', timerMins: 30, isTirosint: true, showRhythm: false, type: 'pill' },
            { id: 'vitd', name: 'Vitamin D3', tag: 'Alle 2 Tage', tagClass: 'tag-orange', dose: '5', unit: 'Tropfen', desc: 'Tropfen einnehmen', timeStr: '07:45', timerMins: 0, isTirosint: false, showRhythm: true, type: 'drop' },
            { id: 'magnesium', name: 'Magnesium', tag: 'Täglich', tagClass: 'tag-purple', dose: '1x', unit: 'Abends', desc: 'Vor dem Schlafen', timeStr: '19:00', timerMins: 0, isTirosint: false, showRhythm: false, type: 'pill' }
        ];

        let items = JSON.parse(localStorage.getItem("tirosint_custom_items")) || defaultItems;
        const startDateKey = "tirosint_start_date";
        let startDate = localStorage.getItem(startDateKey) || "2026-10-31";

        function updateKurInfo() {
            if (!startDate) {
                document.querySelector('.card').style.display = 'none';
            } else {
                document.querySelector('.card').style.display = 'block';
                const start = new Date(startDate);
                const today = new Date();
                today.setHours(0,0,0,0);
                start.setHours(0,0,0,0);

                const diffTime = today - start;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                
                let currentDayInCycle = (diffDays % 14) + 1;
                if (currentDayInCycle < 1) currentDayInCycle = 1;

                const is150 = currentDayInCycle % 2 !== 0;
                const dose = is150 ? "150 µg" : "137,5 µg";

                document.getElementById("kur-tag-badge").innerText = `Tag ${currentDayInCycle} von 14`;
                document.getElementById("today-dose-text").innerText = `Heute: ${dose}`;

                items.forEach(item => {
                    if (item.isTirosint) {
                        item.dose = is150 ? "150" : "137,5";
                        item.unit = "µg";
                    }
                });

                const progressPercent = (currentDayInCycle / 14) * 100;
                document.getElementById("progress-fill").style.width = progressPercent + "%";
            }
            renderItems();
        }

        const todayStr = new Date().toISOString().slice(0,10);
        const storagePrefix = "med_status_" + todayStr + "_";

        function getCategory(timeStr) {
            if (!timeStr) return { title: '☀️ Morgens (05:00 - 11:00)', sort: 1 };
            const hour = parseInt(timeStr.split(':')[0], 10);
            if (hour >= 5 && hour < 11) {
                return { title: '☀️ Morgens (05:00 - 11:00)', sort: 1 };
            } else if (hour >= 11 && hour < 14) {
                return { title: '🍽️ Mittags (11:00 - 14:00)', sort: 2 };
            } else {
                return { title: '🌙 Abends (17:00 - 22:00)', sort: 3 };
            }
        }

        function renderItems() {
            const container = document.getElementById("meds-container");
            container.innerHTML = "";

            const categories = {};
            items.forEach(item => {
                const cat = getCategory(item.timeStr);
                if (!categories[cat.title]) {
                    categories[cat.title] = { sort: cat.sort, items: [] };
                }
                categories[cat.title].items.push(item);
            });

            const sortedCatKeys = Object.keys(categories).sort((a, b) => categories[a].sort - categories[b].sort);

            let html = '';
            sortedCatKeys.forEach(catTitle => {
                html += `<div class="section-label">${catTitle}</div>`;
                categories[catTitle].items.forEach(item => {
                    const isChecked = localStorage.getItem(storagePrefix + item.id) === "true";
                    const tagHtml = item.showRhythm && item.tag ? `<span class="tag ${item.tagClass || 'tag-green'}">${item.tag}</span>` : '';
                    let iconHtml = '';
                    if (item.type === 'pill') iconHtml = pillIcon;
                    if (item.type === 'drop') iconHtml = dropIcon;
                    
                    html += `
                        <div class="item-row">
                            <div class="item-info" onclick="openHistoryModal('${item.id}', '${item.name}')" title="Klicken für Verlauf">
                                <div class="item-title-line">
                                    <span class="item-name">${iconHtml} ${item.name}</span>
                                    ${tagHtml}
                                </div>
                                <div class="item-desc">${item.desc} (${item.timeStr || '08:00'} Uhr)</div>
                            </div>
                            <div class="item-right">
                                <div class="item-dose">${item.dose}<span>${item.unit}</span></div>
                                <button class="edit-btn-frame" onclick="openEditItemModal('${item.id}')" title="Bearbeiten">
                                    <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                                </button>
                                <button class="check-btn ${isChecked ? 'checked' : ''}" id="btn-${item.id}" onclick="handleCheck('${item.id}', ${item.timerMins || 0}, '${item.name}')">
                                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </button>
                            </div>
                        </div>
                    `;
                });
            });

            container.innerHTML = html;

            const savedEndTime = localStorage.getItem("global_timer_end");
            const savedName = localStorage.getItem("global_timer_name");
            if (savedEndTime && savedEndTime > Date.now()) {
                startTimer(parseInt(savedEndTime), savedName);
            }
        }

        updateKurInfo();

        function handleCheck(id, timerMins, name) {
            const btn = document.getElementById("btn-" + id);
            btn.classList.toggle("checked");
            const isChecked = btn.classList.contains("checked");
            localStorage.setItem(storagePrefix + id, isChecked);
            localStorage.setItem("history_" + id + "_" + todayStr, isChecked);

            if (timerMins > 0) {
                if (isChecked) {
                    const endTime = Date.now() + timerMins * 60 * 1000;
                    localStorage.setItem("global_timer_end", endTime);
                    localStorage.setItem("global_timer_name", name);
                    startTimer(endTime, name);
                } else {
                    localStorage.removeItem("global_timer_end");
                    localStorage.removeItem("global_timer_name");
                    stopTimer();
                }
            }
        }

        let timerInterval = null;

        function startTimer(endTime, name) {
            const box = document.getElementById("timer-box-global");
            document.getElementById("timer-label-global").innerText = `⏳ Wartezeit: ${name || 'Läuft...'}`;
            if (box) box.classList.add("active");
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                const timeLeft = endTime - Date.now();
                const countdownEl = document.getElementById("timer-countdown-global");
                if (!countdownEl) return;

                if (timeLeft <= 0) {
                    countdownEl.innerText = "00:00 - Zeit vorbei! 🎉";
                    clearInterval(timerInterval);
                    localStorage.removeItem("global_timer_end");
                    localStorage.removeItem("global_timer_name");
                } else {
                    const mins = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    const secs = Math.floor((timeLeft % (1000 * 60)) / 1000);
                    countdownEl.innerText = String(mins).padStart(2, '0') + ":" + String(secs).padStart(2, '0');
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            const box = document.getElementById("timer-box-global");
            if (box) box.classList.remove("active");
        }

        // Modal Einstellungen (Kur)
        function openSettingsModal() {
            document.getElementById("start-date-input").value = startDate;
            document.getElementById("settings-modal").classList.add("open");
        }
        function closeSettingsModal() {
            document.getElementById("settings-modal").classList.remove("open");
        }
        function saveSettings() {
            const newDate = document.getElementById("start-date-input").value;
            if (newDate) {
                startDate = newDate;
                localStorage.setItem(startDateKey, startDate);
                updateKurInfo();
            }
            closeSettingsModal();
        }
        function deleteKur() {
            localStorage.removeItem(startDateKey);
            startDate = null;
            updateKurInfo();
            closeSettingsModal();
        }

        // Modal Hinzufügen / Bearbeiten
        function openAddModal() {
            document.getElementById("item-modal-title").innerText = "Neuen Eintrag hinzufügen";
            document.getElementById("edit-item-id").value = "";
            document.getElementById("form-name").value = "";
            document.getElementById("form-type").value = "none";
            document.getElementById("form-rhythm").value = "Täglich";
            document.getElementById("form-dose").value = "";
            document.getElementById("form-time-input").value = "08:00";
            document.getElementById("form-timer-mins").value = "0";
            document.getElementById("form-desc").value = "";
            document.getElementById("btn-delete-item").style.display = "none";
            document.getElementById("item-modal").classList.add("open");
        }

        function openEditItemModal(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            document.getElementById("item-modal-title").innerText = "Eintrag bearbeiten";
            document.getElementById("edit-item-id").value = item.id;
            document.getElementById("form-name").value = item.name;
            document.getElementById("form-type").value = item.type || "none";
            document.getElementById("form-rhythm").value = item.tag || "Täglich";
            document.getElementById("form-dose").value = item.dose + (item.unit ? " " + item.unit : "");
            document.getElementById("form-time-input").value = item.timeStr || "08:00";
            document.getElementById("form-timer-mins").value = item.timerMins || 0;
            document.getElementById("form-desc").value = item.desc;
            
            document.getElementById("btn-delete-item").style.display = item.isTirosint ? "none" : "block";
            document.getElementById("item-modal").classList.add("open");
        }

        function closeItemModal() {
            document.getElementById("item-modal").classList.remove("open");
        }

        function saveItemForm() {
            const editId = document.getElementById("edit-item-id").value;
            const name = document.getElementById("form-name").value;
            const type = document.getElementById("form-type").value;
            const rhythm = document.getElementById("form-rhythm").value;
            const doseFull = document.getElementById("form-dose").value;
            const timeStr = document.getElementById("form-time-input").value;
            const timerMins = parseInt(document.getElementById("form-timer-mins").value) || 0;
            const desc = document.getElementById("form-desc").value;

            if (!name) return;
            
            let dose = doseFull;
            let unit = "";
            const doseParts = doseFull.split(" ");
            if (doseParts.length > 1) {
                dose = doseParts[0];
                unit = doseParts.slice(1).join(" ");
            }

            if (editId) {
                const item = items.find(i => i.id === editId);
                if (item) {
                    item.name = name;
                    item.type = type;
                    item.tag = rhythm;
                    item.showRhythm = true;
                    item.dose = dose;
                    item.unit = unit;
                    item.timeStr = timeStr;
                    item.timerMins = timerMins;
                    item.desc = desc;
                }
            } else {
                const newId = "custom_" + Date.now();
                items.push({
                    id: newId,
                    name: name,
                    type: type,
                    tag: rhythm,
                    showRhythm: true, 
                    tagClass: 'tag-green',
                    dose: dose,
                    unit: unit,
                    desc: desc,
                    timeStr: timeStr,
                    timerMins: timerMins,
                    isTirosint: false
                });
            }

            localStorage.setItem("tirosint_custom_items", JSON.stringify(items));
            closeItemModal();
            renderItems();
        }

        function deleteCurrentItem() {
            const editId = document.getElementById("edit-item-id").value;
            if (!editId) return;

            items = items.filter(i => i.id !== editId);
            localStorage.setItem("tirosint_custom_items", JSON.stringify(items));
            closeItemModal();
            renderItems();
        }

        // Kalender / Historie Modal
        function openHistoryModal(itemId, itemName) {
            document.getElementById("history-modal-title").innerText = `Verlauf: ${itemName}`;
            const gridContainer = document.getElementById("history-grid-container");
            gridContainer.innerHTML = "";

            let takenCount = 0;
            const d = new Date();

            for (let i = 13; i >= 0; i--) {
                const pastDate = new Date();
                pastDate.setDate(d.getDate() - i);
                const dateStr = pastDate.toISOString().slice(0,10);
                const dayNum = pastDate.getDate();

                const wasTaken = localStorage.getItem("history_" + itemId + "_" + dateStr) === "true";
                if (wasTaken) takenCount++;

                gridContainer.innerHTML += `
                    <div class="history-day ${wasTaken ? 'taken' : ''}">
                        <div style="font-size:8px; color:var(--text-muted);">${pastDate.toLocaleDateString('de-DE', {weekday:'short'})}</div>
                        <div style="font-weight:700; font-size:12px;">${dayNum}</div>
                    </div>
                `;
            }

            document.getElementById("history-stats").innerText = `Eingenommen an ${takenCount} von 14 Tagen`;
            document.getElementById("history-modal").classList.add("open");
        }

        function closeHistoryModal() {
            document.getElementById("history-modal").classList.remove("open");
        }
    </script>
</body>
</html>
