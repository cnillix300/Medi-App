<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tirosint & Supplements</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #141c2e;
            --card-border: #1e293b;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --badge-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .app-icon svg {
            width: 26px;
            height: 26px;
            fill: #ffffff;
        }

        .header-title h1 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
        }

        .header-title p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: var(--badge-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-icon:hover {
            background: #273548;
        }

        .btn-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Card Base */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
        }

        /* Progress Card */
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .progress-badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .progress-bar-bg {
            background: #1e293b;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar-fill {
            background: var(--accent-green);
            height: 100%;
            width: 7%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-footer {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
        }

        .progress-footer strong {
            color: var(--text-main);
        }

        /* Section Title */
        .section-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Item Row */
        .item-row {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-info {
            flex-grow: 1;
            padding-right: 12px;
        }

        .item-title-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .item-name {
            font-size: 16px;
            font-weight: 700;
        }

        .tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .tag-blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .tag-orange { background: rgba(249, 115, 22, 0.15); color: #fb923c; }
        .tag-purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
        .tag-green { background: rgba(16, 185, 129, 0.15); color: #34d399; }

        .item-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .item-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-dose {
            font-size: 16px;
            font-weight: 700;
            text-align: right;
        }

        .item-dose span {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .row-action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .row-action-btn:hover {
            color: var(--text-main);
        }

        .row-action-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Checkbox Button */
        .check-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 2px solid var(--card-border);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .check-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s;
        }

        .check-btn.checked {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }

        .check-btn.checked svg {
            stroke: #ffffff;
            fill: none;
        }

        /* Timer Box */
        .timer-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            display: none;
            text-align: center;
        }

        .timer-box.active {
            display: block;
        }

        .timer-text {
            font-size: 13px;
            color: var(--accent-green);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .timer-countdown {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
        }

        /* Footer Info */
        .footer-note {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 24px;
            margin-bottom: 12px;
        }

        /* Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
        }

        .form-control {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px;
            color: var(--text-main);
            font-size: 14px;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background: var(--accent-green);
            color: white;
        }

        .btn-secondary {
            background: var(--badge-bg);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="app-icon">
                    <svg viewBox="0 0 24 24"><path d="M4.5 10.5C3.67 10.5 3 11.17 3 12s.67 1.5 1.5 1.5h15c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5h-15zM10.5 4.5C10.5 3.67 11.17 3 12 3s1.5.67 1.5 1.5v15c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5v-15z"/></svg>
                </div>
                <div class="header-title">
                    <h1>Tirosint & Supplements</h1>
                    <p id="current-date">Freitag, 30. Oktober 2026</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="openAddModal()" title="Neuen Eintrag hinzufügen">
                    <!-- Plus Symbol -->
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </button>
                <button class="btn-icon" onclick="openSettingsModal()" title="Einstellungen (Startdatum)">
                    <!-- Zahnrad Symbol -->
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                </button>
            </div>
        </div>

        <!-- 14-Tage Wechselkur Card -->
        <div class="card">
            <div class="progress-header">
                <div class="progress-title">
                    📅 14-Tage Wechselkur
                </div>
                <div class="progress-badge" id="kur-tag-badge">Tag 1 von 14</div>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div class="progress-footer">
                <span>Wechsel: 150 µg ⇄ 137,5 µg</span>
                <strong id="today-dose-text">Heute: 150 µg</strong>
            </div>
        </div>

        <!-- Dynamischer Container für Medikamente & Supplements -->
        <div id="meds-container"></div>

        <div class="footer-note">Erinnerungen aktiv für Morgens & Abends</div>
    </div>

    <!-- Modal für Einstellungen (Startdatum) -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Kur-Einstellungen</h3>
                <button class="btn-icon" onclick="closeSettingsModal()">✕</button>
            </div>
            <div class="form-group">
                <label>Startdatum der 14-Tage-Kur</label>
                <input type="date" id="start-date-input" class="form-control">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeSettingsModal()">Abbrechen</button>
                <button class="btn btn-primary" onclick="saveSettings()">Speichern</button>
            </div>
        </div>
    </div>

    <!-- Modal für Hinzufügen / Bearbeiten von Einträgen -->
    <div class="modal" id="item-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="item-modal-title">Eintrag hinzufügen</h3>
                <button class="btn-icon" onclick="closeItemModal()">✕</button>
            </div>
            <input type="hidden" id="edit-item-id">
            <div class="form-group">
                <label>Name (z.B. Tirosint, Magnesium)</label>
                <input type="text" id="form-name" class="form-control" placeholder="Name eingeben">
            </div>
            <div class="form-group">
                <label>Kategorie / Tag (z.B. Weichkapsel, Täglich)</label>
                <input type="text" id="form-tag" class="form-control" placeholder="z.B. Weichkapsel">
            </div>
            <div class="form-group">
                <label>Dosierung / Einheit (z.B. 150 µg, 5 Tropfen)</label>
                <input type="text" id="form-dose" class="form-control" placeholder="z.B. 150 µg">
            </div>
            <div class="form-group">
                <label>Beschreibung / Hinweis</label>
                <input type="text" id="form-desc" class="form-control" placeholder="z.B. Nüchtern mit Wasser">
            </div>
            <div class="form-group">
                <label>Tageszeit</label>
                <select id="form-time" class="form-control">
                    <option value="morgens">Morgens (07:30 Uhr)</option>
                    <option value="abends">Abends (18:30 Uhr)</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-danger" id="btn-delete-item" onclick="deleteCurrentItem()" style="display:none;">Löschen</button>
                <button class="btn btn-secondary" onclick="closeItemModal()">Abbrechen</button>
                <button class="btn btn-primary" onclick="saveItemForm()">Speichern</button>
            </div>
        </div>
    </div>

    <script>
        // Standard-Einträge falls noch nichts gespeichert
        const defaultItems = [
            { id: 'tirosint', name: 'Tirosint', tag: 'Weichkapsel', tagClass: 'tag-blue', dose: '150', unit: 'µg', desc: 'Nüchtern mit Wasser (danach 30 Min. warten)', time: 'morgens', isTirosint: true },
            { id: 'vitd', name: 'Vitamin D3', tag: 'Alle 2 Tage', tagClass: 'tag-orange', dose: '5', unit: 'Tropfen', desc: '5 Tropfen einnehmen', time: 'morgens', isTirosint: false },
            { id: 'magnesium', name: 'Magnesium', tag: 'Täglich', tagClass: 'tag-purple', dose: '1x', unit: 'Abends', desc: '1 Dosis vor dem Schlafen', time: 'abends', isTirosint: false }
        ];

        let items = JSON.parse(localStorage.getItem("tirosint_custom_items")) || defaultItems;

        // Datum und Kur-Logik
        const startDateKey = "tirosint_start_date";
        let startDate = localStorage.getItem(startDateKey) || "2026-10-31";

        function updateKurInfo() {
            const start = new Date(startDate);
            const today = new Date();
            today.setHours(0,0,0,0);
            start.setHours(0,0,0,0);

            const diffTime = today - start;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            let currentDayInCycle = (diffDays % 14) + 1;
            if (currentDayInCycle < 1) currentDayInCycle = 1;

            const is150 = currentDayInCycle % 2 !== 0;
            const dose = is150 ? "150 µg" : "137,5 µg";

            document.getElementById("kur-tag-badge").innerText = `Tag ${currentDayInCycle} von 14`;
            document.getElementById("today-dose-text").innerText = `Heute: ${dose}`;

            // Wenn Tirosint in der Liste existiert, Dosis automatisch anpassen
            items.forEach(item => {
                if (item.isTirosint) {
                    item.dose = is150 ? "150" : "137,5";
                    item.unit = "µg";
                }
            });

            const progressPercent = (currentDayInCycle / 14) * 100;
            document.getElementById("progress-fill").style.width = progressPercent + "%";
            renderItems();
        }

        // Render Items auf der Oberfläche
        const todayStr = new Date().toISOString().slice(0,10);
        const storagePrefix = "med_status_" + todayStr + "_";

        function renderItems() {
            const container = document.getElementById("container-meds") || document.getElementById("meds-container");
            container.innerHTML = "";

            const morgensItems = items.filter(i => i.time === 'morgens');
            const abendsItems = items.filter(i => i.time === 'abends');

            let html = '';

            // Morgens Sektion
            if (morgensItems.length > 0) {
                html += `<div class="section-label">☀️ Morgens (07:30 Uhr)</div>`;
                morgensItems.forEach(item => {
                    const isChecked = localStorage.getItem(storagePrefix + item.id) === "true";
                    html += `
                        <div class="item-row">
                            <div class="item-info">
                                <div class="item-title-line">
                                    <span class="item-name">${item.name}</span>
                                    <span class="tag ${item.tagClass || 'tag-green'}">${item.tag}</span>
                                </div>
                                <div class="item-desc">${item.desc}</div>
                            </div>
                            <div class="item-right">
                                <div class="item-dose">${item.dose}<span>${item.unit}</span></div>
                                <button class="row-action-btn" onclick="openEditItemModal('${item.id}')" title="Bearbeiten">
                                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                                </button>
                                <button class="check-btn ${isChecked ? 'checked' : ''}" id="btn-${item.id}" onclick="${item.isTirosint ? 'toggleTirosint()' : `toggleItem('${item.id}')`}">
                                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </button>
                            </div>
                        </div>
                    `;
                });
                
                // Timer Box unter Morgens
                html += `
                    <div class="timer-box" id="timer-box">
                        <div class="timer-text">⏳ 30 Minuten Wartezeit bis zum Frühstück</div>
                        <div class="timer-countdown" id="timer-countdown">30:00</div>
                    </div>
                `;
            }

            // Abends Sektion
            if (abendsItems.length > 0) {
                html += `<div class="section-label">🌙 Abends (18:30 Uhr)</div>`;
                abendsItems.forEach(item => {
                    const isChecked = localStorage.getItem(storagePrefix + item.id) === "true";
                    html += `
                        <div class="item-row">
                            <div class="item-info">
                                <div class="item-title-line">
                                    <span class="item-name">${item.name}</span>
                                    <span class="tag ${item.tagClass || 'tag-green'}">${item.tag}</span>
                                </div>
                                <div class="item-desc">${item.desc}</div>
                            </div>
                            <div class="item-right">
                                <div class="item-dose">${item.dose}<span>${item.unit}</span></div>
                                <button class="row-action-btn" onclick="openEditItemModal('${item.id}')" title="Bearbeiten">
                                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                                </button>
                                <button class="check-btn ${isChecked ? 'checked' : ''}" id="btn-${item.id}" onclick="toggleItem('${item.id}')">
                                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </button>
                            </div>
                        </div>
                    `;
                });
            }

            container.innerHTML = html;

            // Timer-Status nach Render prüfen
            const savedEndTime = localStorage.getItem(timerKey);
            if (savedEndTime && savedEndTime > Date.now()) {
                startTimer(parseInt(savedEndTime));
            }
        }

        updateKurInfo();

        function toggleItem(id) {
            const btn = document.getElementById("btn-" + id);
            btn.classList.toggle("checked");
            const isChecked = btn.classList.contains("checked");
            localStorage.setItem(storagePrefix + id, isChecked);
        }

        // Timer Logik
        let timerInterval = null;
        const timerKey = "tirosint_timer_end_" + todayStr;

        function toggleTirosint() {
            const btn = document.getElementById("btn-tirosint");
            btn.classList.toggle("checked");
            const isChecked = btn.classList.contains("checked");
            localStorage.setItem(storagePrefix + "tirosint", isChecked);

            if (isChecked) {
                const endTime = Date.now() + 30 * 60 * 1000;
                localStorage.setItem(timerKey, endTime);
                startTimer(endTime);
            } else {
                localStorage.removeItem(timerKey);
                stopTimer();
            }
        }

        function startTimer(endTime) {
            const box = document.getElementById("timer-box");
            if (box) box.classList.add("active");
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                const timeLeft = endTime - Date.now();
                const countdownEl = document.getElementById("timer-countdown");
                if (!countdownEl) return;

                if (timeLeft <= 0) {
                    countdownEl.innerText = "00:00 - Zeit zum Frühstücken! 🎉";
                    clearInterval(timerInterval);
                    localStorage.removeItem(timerKey);
                } else {
                    const mins = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    const secs = Math.floor((timeLeft % (1000 * 60)) / 1000);
                    countdownEl.innerText = String(mins).padStart(2, '0') + ":" + String(secs).padStart(2, '0');
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            const box = document.getElementById("timer-box");
            if (box) box.classList.remove("active");
        }

        // Modal Funktionen (Einstellungen)
        function openSettingsModal() {
            document.getElementById("start-date-input").value = startDate;
            document.getElementById("settings-modal").classList.add("open");
        }

        function closeSettingsModal() {
            document.getElementById("settings-modal").classList.remove("open");
        }

        function saveSettings() {
            const newDate = document.getElementById("start-date-input").value;
            if (newDate) {
                startDate = newDate;
                localStorage.setItem(startDateKey, startDate);
                updateKurInfo();
            }
            closeSettingsModal();
        }

        // Modal Funktionen (Eintrag hinzufügen / bearbeiten)
        function openAddModal() {
            document.getElementById("item-modal-title").innerText = "Neuen Eintrag hinzufügen";
            document.getElementById("edit-item-id").value = "";
            document.getElementById("form-name").value = "";
            document.getElementById("form-tag").value = "Täglich";
            document.getElementById("form-dose").value = "1x";
            document.getElementById("form-desc").value = "";
            document.getElementById("form-time").value = "abends";
            document.getElementById("btn-delete-item").style.display = "none";
            document.getElementById("item-modal").classList.add("open");
        }

        function openEditItemModal(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            document.getElementById("item-modal-title").innerText = "Eintrag bearbeiten";
            document.getElementById("edit-item-id").value = item.id;
            document.getElementById("form-name").value = item.name;
            document.getElementById("form-tag").value = item.tag;
            document.getElementById("form-dose").value = item.dose;
            document.getElementById("form-desc").value = item.desc;
            document.getElementById("form-time").value = item.time;
            
            // Tirosint soll man nicht komplett löschen können
            if (item.isTirosint) {
                document.getElementById("btn-delete-item").style.display = "none";
            } else {
                document.getElementById("btn-delete-item").style.display = "block";
            }

            document.getElementById("item-modal").classList.add("open");
        }

        function closeItemModal() {
            document.getElementById("item-modal").classList.remove("open");
        }

        function saveItemForm() {
            const editId = document.getElementById("edit-item-id").value;
            const name = document.getElementById("form-name").value;
            const tag = document.getElementById("form-tag").value;
            const dose = document.getElementById("form-dose").value;
            const desc = document.getElementById("form-desc").value;
            const time = document.getElementById("form-time").value;

            if (!name) return;

            if (editId) {
                // Bearbeiten
                const item = items.find(i => i.id === editId);
                if (item) {
                    item.name = name;
                    item.tag = tag;
                    item.dose = dose;
                    item.desc = desc;
                    item.time = time;
                }
            } else {
                // Neu hinzufügen
                const newId = "custom_" + Date.now();
                items.push({
                    id: newId,
                    name: name,
                    tag: tag,
                    tagClass: 'tag-green',
                    dose: dose,
                    unit: '',
                    desc: desc,
                    time: time,
                    isTirosint: false
                });
            }

            localStorage.setItem("tirosint_custom_items", JSON.stringify(items));
            closeItemModal();
            renderItems();
        }

        function deleteCurrentItem() {
            const editId = document.getElementById("edit-item-id").value;
            if (!editId) return;

            items = items.filter(i => i.id !== editId);
            localStorage.setItem("tirosint_custom_items", JSON.stringify(items));
            closeItemModal();
            renderItems();
        }
    </script>
</body>
</html>
